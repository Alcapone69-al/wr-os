<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>YFX · Interruptor WR Oficina</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#060708;color:#F3F4F6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.w{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:22px;letter-spacing:.01em}.sub{margin:0;color:#9CA3AF;font-size:14px}
.card{background:#13161A;border:1px solid #262B32;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.st{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 5px rgba(74,222,128,.15)}
.off .dot{background:#FF6B63;box-shadow:0 0 0 5px rgba(255,107,99,.18)}
label{font-size:13px;color:#9CA3AF}
textarea{width:100%;min-height:92px;resize:vertical;background:#0C0E11;color:#F3F4F6;border:1px solid #262B32;border-radius:12px;padding:12px;font:16px/1.4 inherit}
button{min-height:50px;border-radius:12px;border:1px solid #262B32;background:#1A1E23;color:#F3F4F6;font-weight:700;font-size:16px;padding:0 16px;cursor:pointer}
button.pri{background:linear-gradient(135deg,#F0452A,#C91212);border-color:transparent}
button.ok{background:#1FA855;border-color:transparent}
button:disabled{opacity:.5}
.err{color:#FF6B63;font-size:14px;min-height:18px}.row{display:flex;gap:10px}.row button{flex:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="w">
  <div><h1>WR Oficina · Interruptor</h1><p class="sub">Só a YFX pode ligar ou desligar o serviço.</p></div>

  <section class="card" id="vLogin" hidden>
    <p class="sub">Entre com a conta Google da YFX.</p>
    <button class="pri" id="bGoogle" type="button">Entrar com Google</button>
    <div class="err" id="eLogin" role="alert"></div>
  </section>

  <section class="card" id="vPanel" hidden>
    <div class="st" id="st"><span class="dot"></span><span id="stTxt">A carregar…</span></div>
    <p class="sub" id="stInfo"></p>
    <div id="boxMsg">
      <label for="msg">Mensagem para os utilizadores (opcional)</label>
      <textarea id="msg" maxlength="240" placeholder="Não foi possível aceder à WR Oficina neste momento. Entre em contacto com a YFX para resolver."></textarea>
    </div>
    <button class="pri" id="bPausa" type="button" disabled>Pausar a WR Oficina</button>
    <div class="row" id="rConf" hidden><button id="bNao" type="button">Cancelar</button><button class="pri" id="bSim" type="button">Confirmar pausa</button></div>
    <button class="ok" id="bRetomar" type="button" hidden>Retomar o serviço</button>
    <div class="err" id="ePanel" role="alert"></div>
    <button id="bSair" type="button" style="min-height:40px;background:none;border:0;color:#9CA3AF;text-decoration:underline">Terminar sessão</button>
  </section>
</main>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var ADMIN="yassinibrahimo69@gmail.com";
  function $(i){return document.getElementById(i)}
  var cfg=window.WR_FIREBASE;
  if(!cfg){$("vLogin").hidden=false;$("eLogin").textContent="Configuração do Firebase em falta.";return}
  firebase.initializeApp(cfg);var auth=firebase.auth(),fs=firebase.firestore(),ref=fs.doc("config/estado"),un=null,pausado=false;
  function msgErro(e){var c=e&&e.code||"";return c==="permission-denied"?"Sem permissão. Confirme que está com a conta da YFX e que as regras estão publicadas.":c==="auth/popup-closed-by-user"?"Entrada cancelada.":c==="auth/operation-not-allowed"?"Ative o início de sessão Google no Firebase (Authentication › Sign-in method).":"Não foi possível concluir. Verifique a ligação e tente de novo."}
  function show(on){$("vLogin").hidden=on;$("vPanel").hidden=!on}
  function draw(d){
    var p=d.exists?d.data():null;pausado=!!(p&&p.pausado===true);
    $("st").className="st"+(pausado?" off":"");
    $("stTxt").textContent=pausado?"Em pausa: a WR não consegue usar o app":"Ativo: a WR está a usar o app";
    $("stInfo").textContent=pausado&&p&&p.em?("Pausado em "+new Date(p.em).toLocaleString("pt-PT")):"";
    $("bPausa").hidden=pausado;$("bPausa").disabled=false;$("boxMsg").hidden=pausado;$("bRetomar").hidden=!pausado;$("rConf").hidden=true;
    if(pausado&&p&&p.mensagem)$("msg").value=p.mensagem}
  function grava(on){
    $("ePanel").textContent="";
    var o={pausado:on,em:Date.now(),por:ADMIN};if(on)o.mensagem=$("msg").value.trim();else o.mensagem="";
    return ref.set(o).catch(function(e){$("ePanel").textContent=msgErro(e)})}
  $("bGoogle").onclick=function(){$("eLogin").textContent="";auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){$("eLogin").textContent=msgErro(e)})};
  $("bSair").onclick=function(){auth.signOut()};
  $("bPausa").onclick=function(){$("bPausa").hidden=true;$("rConf").hidden=false};
  $("bNao").onclick=function(){$("rConf").hidden=true;$("bPausa").hidden=false};
  $("bSim").onclick=function(){$("bSim").disabled=true;grava(true).then(function(){$("bSim").disabled=false})};
  $("bRetomar").onclick=function(){$("bRetomar").disabled=true;grava(false).then(function(){$("bRetomar").disabled=false})};
  auth.onAuthStateChanged(function(u){
    if(un){un();un=null}
    if(!u){show(false);return}
    if(String(u.email||"").toLowerCase()!==ADMIN){show(false);$("eLogin").textContent="Esta conta não tem acesso ao interruptor.";auth.signOut();return}
    show(true);un=ref.onSnapshot(draw,function(e){$("stTxt").textContent="Sem acesso ao estado";$("ePanel").textContent=msgErro(e)})});
})();
</script>
</body>
</html>
